<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS Dock Icon Shadow -->
    <filter id="macosShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <!-- Card Background Gradient: Premium Deep Metallic Blue-Gray -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3547" />
      <stop offset="50%" stop-color="#182030" />
      <stop offset="100%" stop-color="#0c101a" />
    </linearGradient>

    <!-- Inner Border Gradient (Glossy Highlight) -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Element Drop Shadow (for shutter/tag to float) -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Shutter Gradient: Bright Blue to Teal to Lime Green -->
    <linearGradient id="shutterGrad" x1="10%" y1="80%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#0055FF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#88FF00" />
    </linearGradient>

    <!-- Tag Gradient: Teal to Lime Green -->
    <linearGradient id="tagGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#88FF00" />
    </linearGradient>

    <!-- Single Blade Path for Reusability -->
    <path id="bladePath" d="M 350,305 C 460,305 520,310 534,350" fill="none" />

    <!-- Shutter Blade with Shadow and White Edge -->
    <g id="bladeElement">
      <!-- Subtle internal dark shading (drop shadow effect) -->
      <use href="#bladePath" stroke="#001A33" stroke-width="6" opacity="0.25" stroke-linecap="round" transform="translate(-2, 4)" />
      <!-- Sharp white line defining the blade -->
      <use href="#bladePath" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    </g>
  </defs>

  <!-- macOS Style Squircle Container with drop shadow -->
  <rect x="48" y="48" width="416" height="416" rx="92" ry="92" fill="url(#cardBg)" filter="url(#macosShadow)" />
  
  <!-- Sleek Glossy Border Overlay -->
  <rect x="48" y="48" width="416" height="416" rx="92" ry="92" fill="none" stroke="url(#cardBorder)" stroke-width="2" />

  <!-- Logo Group centered and scaled inside the squircle card -->
  <!-- Center of original elements: cx=405, cy=405 (approx) -->
  <g transform="translate(256, 256) scale(0.58) translate(-405, -405)" filter="url(#elementShadow)">
    <!-- Main Composition Group -->
    <g transform="translate(-10, -10)">

      <!-- ================= SHUTTER ELEMENT ================= -->
      <g id="shutter">
        <!-- Base Gradient Circle -->
        <circle cx="350" cy="350" r="184" fill="url(#shutterGrad)" />

        <!-- Overlapping Spiraling Aperture Blades -->
        <use href="#bladeElement" transform="rotate(0 350 350)" />
        <use href="#bladeElement" transform="rotate(60 350 350)" />
        <use href="#bladeElement" transform="rotate(120 350 350)" />
        <use href="#bladeElement" transform="rotate(180 350 350)" />
        <use href="#bladeElement" transform="rotate(240 350 350)" />
        <use href="#bladeElement" transform="rotate(300 350 350)" />

        <!-- Thinner White Inner Circle Border -->
        <circle cx="350" cy="350" r="184" fill="none" stroke="#ffffff" stroke-width="8" />

        <!-- Thick Dark Blue Outer Circular Border -->
        <circle cx="350" cy="350" r="196" fill="none" stroke="#122340" stroke-width="16" />
      </g>

      <!-- ================= PRICE TAG ELEMENT ================= -->
      <!-- Tag Background (Drawn before the string so the string layers over it) -->
      <g id="tag_background" transform="translate(560, 560) rotate(-45)">
        <!-- Rounded Rect Tag Body -->
        <rect x="-65" y="-95" width="130" height="190" rx="24" fill="url(#tagGrad)" stroke="#122340" stroke-width="14" />
      </g>

      <!-- ================= STRING / HOOK ================= -->
      <!-- Connects the center of the shutter to the center of the tag hole -->
      <path d="M 350,350 C 430,360 480,450 517.6,517.6" fill="none" stroke="#122340" stroke-width="10" stroke-linecap="round" />

      <!-- ================= CENTER & HOLE DETAILS ================= -->
      <!-- Shutter Central Opening -->
      <g id="shutter_center">
        <circle cx="350" cy="350" r="44" fill="#ffffff" />
        <circle cx="350" cy="350" r="44" fill="none" stroke="#122340" stroke-width="8" />
      </g>

      <!-- Tag Details -->
      <g id="tag_details" transform="translate(560, 560) rotate(-45)">
        <!-- Tag Hole -->
        <circle cx="0" cy="-60" r="14" fill="#ffffff" stroke="#122340" stroke-width="10" />
        
        <!-- Bold White Checkmark / Stylized L -->
        <path d="M -20, 15 L -5, 30 L 25, -5" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      </g>

    </g>
  </g>
</svg>
